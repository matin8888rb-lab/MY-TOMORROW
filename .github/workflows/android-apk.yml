name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "MY_TOMORROW_Prototype_1_0.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;23.2.8568313 cmake;3.10.2.4988404'

      - name: Extract Godot project
        run: |
          test -f MY_TOMORROW_Prototype_1_0.zip
          mkdir -p source
          unzip -q MY_TOMORROW_Prototype_1_0.zip -d source
          test -f source/MY_TOMORROW_Prototype_1_0/project.godot
          cat > source/MY_TOMORROW_Prototype_1_0/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/MY_TOMORROW.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="org.mytomorrow.valora"
          package/name="MY TOMORROW"
          package/signed=false
          screen/immersive_mode=true
          EOF

      - name: Export Android APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: source/MY_TOMORROW_Prototype_1_0
          presets_to_export: Android
          export_debug: true
          cache: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MY-TOMORROW-Android-APK
          path: source/MY_TOMORROW_Prototype_1_0/build/MY_TOMORROW.apk
          if-no-files-found: error
          retention-days: 14
